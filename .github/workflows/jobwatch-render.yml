name: jobwatch-render
on:
  schedule:
    - cron: "17 3 * * *"   # daily 03:17 UTC = 08:47 IST
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: jobwatch-state
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_TO: ${{ secrets.SMTP_TO }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install headless Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Collect new roles into the outbox (nothing is sent yet)
        run: |
          python jobwatch/watch.py --mode render
      - name: Save state before alerting, so no alert is ever sent twice
        run: |
          bash jobwatch/save_state.sh "jobwatch render run"
      - name: Send queued alerts
        run: |
          python jobwatch/watch.py --notify
      - name: Save the cleared outbox
        if: always()
        run: |
          bash jobwatch/save_state.sh "jobwatch alerts sent"
