name: jobwatch
on:
  schedule:
    - cron: "*/30 * * * *"   # private repo with the free 2,000 min/month? change to "7 * * * *" (hourly)
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: jobwatch-state
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Poll job boards (API mode)
        run: python jobwatch/watch.py --mode api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
      - name: Save state
        if: always()
        run: |
          git config user.name "jobwatch"
          git config user.email "jobwatch@users.noreply.github.com"
          git add jobwatch/state.json jobwatch/coverage.md
          git diff --cached --quiet || (git commit -m "jobwatch: update state" && git pull --rebase -q && git push)
